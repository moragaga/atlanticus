[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-command-center-application-starter"
version = "0.1.0"
requires-python = "==3.14.2"
dependencies = [
    "ada-command-center-generic-application==0.1.0",
]

[project.scripts]
ada-command-center-application-starter = "application.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["application*"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]
