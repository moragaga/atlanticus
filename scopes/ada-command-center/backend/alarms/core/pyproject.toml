[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-command-center-alarms-core"
version = "1.0.0"
description = "Pure deterministic alarm domain contracts for the ADA Command Center operational backend."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada_command_center.alarms.core*"]
namespaces = true

[tool.setuptools.package-data]
"ada_command_center.alarms.core" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada_command_center"]
combine-as-imports = true
