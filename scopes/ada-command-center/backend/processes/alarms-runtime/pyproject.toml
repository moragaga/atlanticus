[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-command-center-alarms-runtime-process"
version = "1.0.0"
description = "Executable Alarm Runtime process for ADA Command Center."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-command-center-alarms-domain==1.0.0",
    "ada-command-center-alarms-core==1.0.0",
    "ada-command-center-alarms-materialization==1.0.0",
    "ada-command-center-alarms-persistence==1.0.0",
    "atlanticus-configuration==1.0.0",
    "atlanticus-datasets-parquet==1.0.0",
    "atlanticus-datasets-runtime==1.0.0",
    "atlanticus-job-runtime==1.0.0",
    "atlanticus-key-vault==1.0.0",
    "atlanticus-observability-azure==1.0.0",
    "atlanticus-operational-data-core==1.0.0",
    "atlanticus-operational-data-planner==1.0.0",
    "atlanticus-operational-data-sources==1.0.0",
    "atlanticus-state==1.0.0",
]

[project.scripts]
ada-command-center-alarms-runtime = "ada_command_center.processes.alarms_runtime.bootstrap:main"

[tool.uv.sources]
ada-command-center-alarms-domain = { path = "../../../domain/alarms", editable = true }
ada-command-center-alarms-core = { workspace = true }
ada-command-center-alarms-materialization = { workspace = true }
ada-command-center-alarms-persistence = { workspace = true }
ada-command-center-tools-domain = { path = "../../../domain/tools", editable = true }
ada-web-tools = { path = "../../../../ada/web/tools/core", editable = true }
atlanticus-configuration = { path = "../../../../../backend/configuration", editable = true }
atlanticus-datasets-runtime = { path = "../../../../../backend/datasets-runtime", editable = true }
atlanticus-datasets = { path = "../../../../../backend/datasets", editable = true }
atlanticus-datasets-parquet = { path = "../../../../../backend/datasets-parquet", editable = true }
atlanticus-job-runtime = { path = "../../../../../backend/runtime", editable = true }
atlanticus-key-vault = { path = "../../../../../connectivity/key-vault", editable = true }
atlanticus-kernel = { path = "../../../../../backend/kernel", editable = true }
atlanticus-observability = { path = "../../../../../backend/observability", editable = true }
atlanticus-observability-azure = { path = "../../../../../backend/observability-azure", editable = true }
atlanticus-json = { path = "../../../../../backend/json", editable = true }
atlanticus-state = { path = "../../../../../backend/state", editable = true }
atlanticus-operational-data-core = { path = "../../../../operational-data/core", editable = true }
atlanticus-operational-data-planner = { path = "../../../../operational-data/planner", editable = true }
atlanticus-operational-data-sources = { path = "../../../../operational-data/sources", editable = true }
atlanticus-operational-data-calendar = { path = "../../../../operational-data/calendar", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada_command_center.processes.alarms_runtime*"]
namespaces = true

[tool.setuptools.package-data]
"ada_command_center.processes.alarms_runtime" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada_command_center", "atlanticus"]
combine-as-imports = true
