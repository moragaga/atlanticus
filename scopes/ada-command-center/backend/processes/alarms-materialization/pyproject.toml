[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-command-center-alarms-materialization-process"
version = "1.0.0"
description = "Executable Alarm Configuration materialization process for ADA Command Center"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-command-center-alarms-domain==1.0.0",
    "ada-command-center-alarms-core==1.0.0",
    "ada-command-center-alarms-materialization==1.0.0",
    "ada-web-tools==0.1.0",
    "ada-command-center-web-alarm-configuration==0.1.0",
    "ada-command-center-web-alarm-projection-cosmos==0.1.0",
    "atlanticus-cosmos==1.0.0",
    "atlanticus-configuration==1.0.0",
    "atlanticus-job-runtime==1.0.0",
    "atlanticus-key-vault==1.0.0",
    "atlanticus-kernel==1.0.0",
    "atlanticus-state==1.0.0",
    "atlanticus-web-projection==0.1.0",
    "atlanticus-web-source==0.1.0",
]

[project.scripts]
ada-command-center-alarms-materialization = "ada_command_center.processes.alarms_materialization.bootstrap:main"

[tool.atlanticus.container]
command = "ada-command-center-alarms-materialization"
system-profile = "base"

[tool.uv.sources]
ada-command-center-alarms-domain = { path = "../../../domain/alarms", editable = true }
ada-command-center-alarms-core = { workspace = true }
ada-command-center-alarms-materialization = { workspace = true }
ada-web-tools = { path = "../../../../ada/web/tools/core", editable = true }
ada-command-center-web-alarm-configuration = { path = "../../../web/alarms/configuration", editable = true }
ada-command-center-web-alarm-projection-cosmos = { path = "../../../web/alarms/projection-cosmos", editable = true }
atlanticus-cosmos = { path = "../../../../../connectivity/cosmos", editable = true }
atlanticus-configuration = { path = "../../../../../backend/configuration", editable = true }
atlanticus-job-runtime = { path = "../../../../../backend/runtime", editable = true }
atlanticus-key-vault = { path = "../../../../../connectivity/key-vault", editable = true }
atlanticus-kernel = { path = "../../../../../backend/kernel", editable = true }
atlanticus-state = { path = "../../../../../backend/state", editable = true }
atlanticus-web-projection = { path = "../../../../../web/capabilities/projection/core", editable = true }
atlanticus-web-source = { path = "../../../../../web/capabilities/source/core", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada_command_center.processes.alarms_materialization*"]

[tool.setuptools.package-data]
"ada_command_center.processes.alarms_materialization" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../../../domain/alarms/src",
    "../../alarms/core/src",
    "../../alarms/materialization/src",
    "../../../domain/tools/src",
    "../../../backend/tools/catalog/src",
    "../../../web/alarms/configuration/src",
    "../../../web/alarms/projection-cosmos/src",
    "../../../web/alarms/projection-local/src",
    "../../../../ada/web/tools/core/src",
    "../../../../../connectivity/cosmos/src",
    "../../../../../connectivity/key-vault/src",
    "../../../../../backend/configuration/src",
    "../../../../../backend/runtime/src",
    "../../../../../backend/state/src",
    "../../../../../backend/kernel/src",
    "../../../../../backend/observability/src",
    "../../../../../web/framework/core/src",
    "../../../../../web/capabilities/manager/src",
    "../../../../../web/capabilities/projection/core/src",
    "../../../../../web/capabilities/source/core/src",
    "../../../../../web/capabilities/storage/topology/src",
]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "ada_command_center", "atlanticus"]
combine-as-imports = true
