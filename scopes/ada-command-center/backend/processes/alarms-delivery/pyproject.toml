[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-command-center-alarms-delivery-process"
version = "1.0.0"
description = "Independent Alarm Delivery input receiver for ADA Command Center."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-command-center-alarms-materialization==1.0.0",
    "ada-command-center-alarms-persistence==1.0.0",
    "atlanticus-configuration==1.0.0",
    "atlanticus-cosmos==1.0.0",
    "atlanticus-job-runtime==1.0.0",
    "atlanticus-key-vault==1.0.0",
    "atlanticus-kernel==1.0.0",
    "atlanticus-state==1.0.0",
]

[project.scripts]
ada-command-center-alarms-delivery = "ada_command_center.processes.alarms_delivery.bootstrap:main"

[tool.atlanticus.container]
command = "ada-command-center-alarms-delivery"
system-profile = "base"

[tool.uv.sources]
ada-command-center-alarms-materialization = { workspace = true }
ada-command-center-alarms-persistence = { workspace = true }
atlanticus-configuration = { path = "../../../../../backend/configuration", editable = true }
atlanticus-cosmos = { path = "../../../../../connectivity/cosmos", editable = true }
atlanticus-job-runtime = { path = "../../../../../backend/runtime", editable = true }
atlanticus-key-vault = { path = "../../../../../connectivity/key-vault", editable = true }
atlanticus-kernel = { path = "../../../../../backend/kernel", editable = true }
atlanticus-state = { path = "../../../../../backend/state", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada_command_center.processes.alarms_delivery*"]
namespaces = true

[tool.setuptools.package-data]
"ada_command_center.processes.alarms_delivery" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada_command_center", "atlanticus"]
combine-as-imports = true
