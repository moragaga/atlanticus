[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-command-center-web-alarm-configuration"
version = "0.1.0"
description = "Alarm Configuration Source contract for ADA Command Center Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-command-center-alarms-core==1.0.0",
    "atlanticus-web-source==0.1.0",
]

[tool.uv.sources]
ada-command-center-alarms-core = { path = "../../../backend/alarms/core", editable = true }
atlanticus-web-source = { path = "../../../../../web/capabilities/source/core", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada_command_center.web.alarms.configuration*"]

[tool.setuptools.package-data]
"ada_command_center.web.alarms.configuration" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada_command_center", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../../../backend/alarms/core/src",
    "../../../../../web/capabilities/source/core/src",
]
addopts = "-q --import-mode=importlib"
