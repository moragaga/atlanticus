[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-command-center-web-alarm-configuration"
version = "0.1.0"
description = "Alarm Configuration Source contract for ADA Command Center Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-command-center-alarms-domain==1.0.0",
    "ada-command-center-tools-catalog==0.1.0",
    "ada-command-center-tools-domain==1.0.0",
    "ada-web-tools==0.1.0",
    "atlanticus-web-projection==0.1.0",
    "atlanticus-web-source==0.1.0",
]

[project.optional-dependencies]
web = [
    "atlanticus-web==0.1.0",
    "atlanticus-web-manager==0.3.18",
    "dash==4.4.1",
]

[tool.uv.sources]
ada-command-center-alarms-domain = { path = "../../../domain/alarms", editable = true }
ada-command-center-tools-catalog = { path = "../../../backend/tools/catalog", editable = true }
ada-command-center-tools-domain = { path = "../../../domain/tools", editable = true }
ada-web-tools = { path = "../../../../ada/web/tools/core", editable = true }
atlanticus-web = { path = "../../../../../web/framework/core", editable = true }
atlanticus-web-manager = { path = "../../../../../web/capabilities/manager", editable = true }
atlanticus-web-projection = { path = "../../../../../web/capabilities/projection/core", editable = true }
atlanticus-web-source = { path = "../../../../../web/capabilities/source/core", editable = true }

[dependency-groups]
dev = [
    "atlanticus-web==0.1.0",
    "atlanticus-web-manager==0.3.18",
    "dash==4.4.1",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada_command_center.web.alarms.configuration*"]

[tool.setuptools.package-data]
"ada_command_center.web.alarms.configuration" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "ada_command_center", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../../../domain/alarms/src",
    "../../../domain/tools/src",
    "../../../backend/tools/catalog/src",
    "../../../../ada/web/tools/core/src",
    "../../../../../web/framework/core/src",
    "../../../../../web/capabilities/manager/src",
    "../../../../../web/capabilities/projection/core/src",
    "../../../../../web/capabilities/source/core/src",
]
addopts = "-q --import-mode=importlib"
