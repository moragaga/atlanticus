[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-operational-data-dataset-reader"
version = "1.0.0"
description = "DatasetRuntime adapter for Atlanticus Operational Data consumers."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-datasets-parquet==1.0.0",
    "atlanticus-datasets-runtime==1.0.0",
    "atlanticus-operational-data-core==1.0.0",
    "atlanticus-operational-data-sources==1.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.operational_data.dataset_reader*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.operational_data.dataset_reader" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus"]
combine-as-imports = true
