[project]
name = "atlanticus-operational-data-workspace"
version = "1.0.0"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.sources]
atlanticus-operational-data-core = { workspace = true }
atlanticus-operational-data-planner = { workspace = true }
atlanticus-operational-data-calendar = { workspace = true }
atlanticus-operational-data-sources = { workspace = true }
atlanticus-datasets = { path = "../../backend/datasets", editable = true }

[tool.uv.workspace]
members = [
    "core",
    "planner",
    "calendar",
    "sources",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
