[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-alarm-delivery-process"
version = "1.0.0"
description = "Alarm Engine live Delivery to named Cosmos Tool projections."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-configuration==1.0.0",
    "atlanticus-cosmos==1.0.0",
    "atlanticus-job-runtime==1.0.0",
    "atlanticus-key-vault==1.0.0",
    "atlanticus-kernel==1.0.0",
    "atlanticus-state==1.0.0",
    "atlanticus-observability-azure==1.0.0",
]

[project.scripts]
ada-alarm-delivery = "ada.processes.alarm_delivery.bootstrap:main"

[tool.atlanticus.container]
command = "ada-alarm-delivery"
system-profile = "base"

[tool.uv.sources]
atlanticus-configuration = { path = "../../../../backend/configuration", editable = true }
atlanticus-cosmos = { path = "../../../../connectivity/cosmos", editable = true }
atlanticus-job-runtime = { path = "../../../../backend/runtime", editable = true }
atlanticus-key-vault = { path = "../../../../connectivity/key-vault", editable = true }
atlanticus-kernel = { path = "../../../../backend/kernel", editable = true }
atlanticus-state = { path = "../../../../backend/state", editable = true }
atlanticus-observability-azure = { path = "../../../../backend/observability-azure", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.processes.alarm_delivery*"]
namespaces = true

[tool.setuptools.package-data]
"ada.processes.alarm_delivery" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
