[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-alarm-modeler-process"
version = "1.0.0"
description = "Live Alarm Modeler for ADA Alarm Engine."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-alarms-materialization==1.0.0",
    "ada-alarms-persistence==1.0.0",
    "ada-contracts-alarms==1.0.0",
    "atlanticus-configuration==1.0.0",
    "atlanticus-job-runtime==1.0.0",
    "atlanticus-key-vault==1.0.0",
    "atlanticus-kernel==1.0.0",
    "atlanticus-state==1.0.0",
    "atlanticus-observability-azure==1.0.0",
]

[project.scripts]
ada-alarm-modeler = "ada.processes.alarm_modeler.bootstrap:main"

[tool.atlanticus.container]
command = "ada-alarm-modeler"
system-profile = "base"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.processes.alarm_modeler*"]
namespaces = true

[tool.setuptools.package-data]
"ada.processes.alarm_modeler" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
