[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-alarm-materialization-process"
version = "1.0.0"
description = "Read-only Alarm Configuration acquisition boundary for ADA Alarm Materialization."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-contracts-alarms==1.0.0",
    "atlanticus-cosmos==1.0.0",
]

[tool.uv.sources]
ada-contracts-alarms = { path = "../../../ada-contracts/alarms", editable = true }
atlanticus-cosmos = { path = "../../../../connectivity/cosmos", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.processes.alarm_materialization*"]
namespaces = true

[tool.setuptools.package-data]
"ada.processes.alarm_materialization" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
