[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-alarms-history"
version = "1.0.0"
description = "Durable Alarm Historian dataset contracts and Parquet materialization."
requires-python = ">=3.14,<3.15"
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3.14", "Typing :: Typed"]
dependencies = [
    "ada-contracts-alarms==1.0.0",
    "atlanticus-datasets==1.0.0",
    "atlanticus-datasets-runtime==1.0.0",
    "pyarrow==25.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.alarms.history*"]

[tool.setuptools.package-data]
"ada.alarms.history" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
