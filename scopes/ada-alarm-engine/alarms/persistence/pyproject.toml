[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-alarms-persistence"
version = "1.0.0"
description = "Local durable persistence for ADA Alarm Engine materialization results."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-alarms-materialization==1.0.0",
    "atlanticus-state==1.0.0",
    "atlanticus-json==1.0.0",
]

[tool.uv.sources]
ada-alarms-materialization = { workspace = true }
atlanticus-state = { path = "../../../../backend/state", editable = true }
atlanticus-json = { path = "../../../../backend/json", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.alarms.persistence*"]
namespaces = true

[tool.setuptools.package-data]
"ada.alarms.persistence" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
