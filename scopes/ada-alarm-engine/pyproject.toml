[project]
name = "ada-alarm-engine-workspace"
version = "1.0.0"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.sources]
ada-alarm-materialization-process = { workspace = true }
ada-alarms-core = { workspace = true }
ada-alarms-materialization = { workspace = true }
ada-alarms-persistence = { workspace = true }
ada-contracts-alarms = { path = "../ada-contracts/alarms", editable = true }
ada-contracts-tools = { path = "../ada-contracts/tools", editable = true }
atlanticus-cosmos = { path = "../../connectivity/cosmos", editable = true }
atlanticus-state = { path = "../../backend/state", editable = true }

[tool.uv.workspace]
members = [
    "alarms/core",
    "alarms/materialization",
    "alarms/persistence",
    "processes/alarm-materialization",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "**/commented/**"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = [
    "alarms/core/tests",
    "alarms/materialization/tests",
    "alarms/persistence/tests",
    "processes/alarm-materialization/tests",
]
