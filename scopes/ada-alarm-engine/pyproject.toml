[project]
name = "ada-alarm-engine-workspace"
version = "1.0.0"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.sources]
ada-alarm-historian-process = { workspace = true }
ada-alarm-materialization-process = { workspace = true }
ada-alarm-runtime-process = { workspace = true }
ada-alarms-core = { workspace = true }
ada-alarms-history = { workspace = true }
ada-alarms-materialization = { workspace = true }
ada-alarms-persistence = { workspace = true }
ada-contracts-alarms = { path = "../ada-contracts/alarms", editable = true }
ada-contracts-tools = { path = "../ada-contracts/tools", editable = true }
atlanticus-configuration = { path = "../../backend/configuration", editable = true }
atlanticus-cosmos = { path = "../../connectivity/cosmos", editable = true }
atlanticus-datasets = { path = "../../backend/datasets", editable = true }
atlanticus-datasets-parquet = { path = "../../backend/datasets-parquet", editable = true }
atlanticus-datasets-runtime = { path = "../../backend/datasets-runtime", editable = true }
atlanticus-job-runtime = { path = "../../backend/runtime", editable = true }
atlanticus-observability = { path = "../../backend/observability", editable = true }
atlanticus-key-vault = { path = "../../connectivity/key-vault", editable = true }
atlanticus-kernel = { path = "../../backend/kernel", editable = true }
atlanticus-observability-azure = { path = "../../backend/observability-azure", editable = true }
atlanticus-operational-data-calendar = { path = "../operational-data/operational-calendar", editable = true }
atlanticus-operational-data-core = { path = "../operational-data/core", editable = true }
atlanticus-operational-data-dataset-reader = { path = "../operational-data/dataset-reader", editable = true }
atlanticus-operational-data-planner = { path = "../operational-data/planner", editable = true }
atlanticus-operational-data-sources = { path = "../operational-data/sources", editable = true }
atlanticus-state = { path = "../../backend/state", editable = true }
atlanticus-json = { path = "../../backend/json", editable = true }

[tool.uv.workspace]
members = [
    "alarms/core",
    "alarms/history",
    "alarms/materialization",
    "alarms/persistence",
    "processes/alarm-historian",
    "processes/alarm-materialization",
    "processes/alarm-runtime",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "**/commented/**"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
