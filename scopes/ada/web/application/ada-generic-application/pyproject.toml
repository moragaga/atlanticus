[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-generic-application"
version = "0.1.19"
description = "Composition root web genérico de ADA sobre Atlanticus Web"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-web-alarm-management-summary==0.1.1",
    "ada-web-alarm-status==0.1.2",
    "ada-web-ui-branding==0.1.2",
    "ada-web-ui-display-status==0.1.0",
    "ada-web-ui-global-indicator==0.1.3",
    "ada-web-ui-core==0.1.0",
    "ada-web-shell-header==0.1.1",
    "ada-web-shell-navigation==0.1.4",
    "atlanticus-web==0.1.0",
    "atlanticus-web-identity==0.1.0",
    "atlanticus-web-identity-local==0.1.0",
    "atlanticus-web-navigation==0.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.scripts]
ada-generic-application = "ada.web.application.generic.__main__:main"

[tool.uv.sources]
ada-web-ui-branding = { path = "../../ui/branding", editable = true }
ada-web-ui-display-status = { path = "../../ui/display-status", editable = true }
ada-web-ui-global-indicator = { path = "../../ui/global-indicator", editable = true }
ada-web-alarm-management-summary = { path = "../../alarms/management-summary", editable = true }
ada-web-alarm-status = { path = "../../alarms/status", editable = true }
ada-web-ui-core = { path = "../../ui/core", editable = true }
ada-web-shell-header = { path = "../../shell/header", editable = true }
ada-web-shell-navigation = { path = "../../shell/navigation", editable = true }
atlanticus-web = { path = "../../../../../web/framework/core", editable = true }
atlanticus-web-observability = { path = "../../../../../web/framework/observability", editable = true }
atlanticus-web-identity = { path = "../../../../../web/capabilities/identity/core", editable = true }
atlanticus-web-identity-local = { path = "../../../../../web/capabilities/identity/local", editable = true }
atlanticus-web-navigation = { path = "../../../../../web/capabilities/navigation/core", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.application.generic*"]

[tool.setuptools.package-data]
"ada.web.application.generic" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "commented",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
