[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-generic-application"
version = "0.2.17"
description = "Composition root web genérico de ADA sobre Atlanticus Web"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-configuration-manager==0.5.1",
    "atlanticus-web-users-cosmos==0.1.0",
    "atlanticus-web-users-blob==0.1.0",
    "atlanticus-web-source-blob==0.1.0",
    "atlanticus-web-storage-topology==0.1.0",
    "atlanticus-web-storage-cosmos==0.1.0",
    "atlanticus-web-profiles-projection-cosmos==0.1.0",
    "atlanticus-web-navigation-projection-cosmos==0.1.0",
    "ada-web-tools-projection-cosmos==0.1.0",
    "ada-web-kpi-registry-projection-cosmos==0.1.0",
    "ada-web-kpi-definition-projection-cosmos==0.1.0",
    "ada-web-access-projection-cosmos==0.1.0",
    "ada-web-access-configuration==0.1.0",
    "ada-web-operational-state==0.1.0",
    "ada-web-operational-render-binding==0.1.0",
    "ada-web-storage-namespace==0.1.0",
    "ada-web-tools==0.1.0",
    "ada-web-tools-configuration==0.1.0",
    "ada-web-tools-persistence==0.1.0",
    "ada-web-time-status-store-adapter==0.1.0",
    "ada-web-content-state==0.1.0",
    "ada-web-alarm-management-summary==0.1.5",
    "ada-web-alarm-status==0.1.7",
    "ada-web-branding[web]==0.1.0",
    "ada-web-ui-content-state==0.1.6",
    "ada-web-ui-display-status==0.1.1",
    "ada-web-ui-global-indicator==0.2.9",
    "ada-web-ui-time-status==0.1.15",
    "ada-web-ui-core==0.2.0",
    "ada-web-shell-header==0.1.8",
    "ada-web-shell-navigation==0.1.7",
    "ada-web-runtime-experience==0.1.0",
    "ada-web-kpi-collector==0.1.0",
    "atlanticus-cosmos==1.0.0",
    "atlanticus-storage==1.0.0",
    "atlanticus-web==0.1.0",
    "atlanticus-web-bootstrap==0.1.0",
    "atlanticus-web-configuration==0.1.0",
    "atlanticus-web-identity==0.1.0",
    "atlanticus-web-identity-local==0.1.0",
    "atlanticus-web-navigation==0.1.0",
    "atlanticus-web-manager==0.3.18",
    "atlanticus-web-profiles==0.1.0",
    "atlanticus-web-users==0.1.0",
    "atlanticus-web-projection==0.1.0",
    "ada-web-ui-page-readiness==0.1.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.14.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.scripts]
ada-generic-manager-resources = "ada.web.application.generic.manager_deployment:manager_resources_main"
ada-generic-application = "ada.web.application.generic.__main__:main"

