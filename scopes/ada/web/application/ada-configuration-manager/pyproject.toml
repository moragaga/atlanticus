[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-configuration-manager"
version = "0.5.1"
description = "Composition backend de ADA para Atlanticus Manager"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-web-access-configuration[web]==0.1.0",
    "ada-web-kpi-configuration[web]==0.3.6",
    "ada-web-kpi-definition[web]==0.6.0",
    "ada-web-tools==0.1.0",
    "ada-web-tools-configuration[web]==0.1.0",
    "atlanticus-web==0.1.0",
    "atlanticus-web-bootstrap==0.1.0",
    "atlanticus-web-identity==0.1.0",
    "atlanticus-web-manager==0.3.18",
    "atlanticus-web-composition-profiles-manager==0.1.0",
    "atlanticus-web-composition-users-manager==0.1.0",
    "atlanticus-web-navigation==0.1.0",
    "atlanticus-web-navigation-configuration[web]==0.1.9",
    "atlanticus-web-projection==0.1.0",
    "atlanticus-web-source==0.1.0",
    "atlanticus-web-users[web]==0.1.0",
]

[tool.uv.sources]
ada-web-access = { path = "../../access/core", editable = true }
ada-web-access-configuration = { path = "../../access/configuration", editable = true }
ada-web-kpi-configuration = { path = "../../kpis/configuration", editable = true }
ada-web-kpi-definition = { path = "../../kpis/definition", editable = true }
atlanticus-web = { path = "../../../../../web/framework/core", editable = true }
atlanticus-web-bootstrap = { path = "../../../../../web/framework/bootstrap", editable = true }
atlanticus-web-identity = { path = "../../../../../web/capabilities/identity/core", editable = true }
atlanticus-web-manager = { path = "../../../../../web/capabilities/manager", editable = true }
atlanticus-web-profiles = { path = "../../../../../web/capabilities/profiles/core", editable = true }
atlanticus-web-composition-profiles-manager = { path = "../../../../../web/compositions/profiles-manager", editable = true }
atlanticus-web-composition-users-manager = { path = "../../../../../web/compositions/users-manager", editable = true }
atlanticus-web-projection = { path = "../../../../../web/capabilities/projection/core", editable = true }
atlanticus-web-source = { path = "../../../../../web/capabilities/source/core", editable = true }
atlanticus-web-source-local = { path = "../../../../../web/capabilities/source/local", editable = true }
atlanticus-web-users = { path = "../../../../../web/capabilities/users/core", editable = true }
atlanticus-web-navigation = { path = "../../../../../web/capabilities/navigation/core", editable = true }
atlanticus-web-navigation-configuration = { path = "../../../../../web/capabilities/navigation/configuration", editable = true }
ada-web-tools = { path = "../../tools/core", editable = true }
ada-web-tools-configuration = { path = "../../tools/configuration", editable = true }

[dependency-groups]
dev = [
    "atlanticus-web-source-local==0.1.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.application.configuration_manager*"]

[tool.setuptools.package-data]
"ada.web.application.configuration_manager" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "commented",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../../access/core/src",
    "../../access/configuration/src",
    "../../kpis/configuration/src",
    "../../kpis/definition/src",
    "../../tools/core/src",
    "../../tools/configuration/src",
    "../../../../../web/framework/core/src",
    "../../../../../web/framework/bootstrap/src",
    "../../../../../web/capabilities/identity/core/src",
    "../../../../../web/capabilities/manager/src",
    "../../../../../web/capabilities/profiles/core/src",
    "../../../../../web/compositions/profiles-manager/src",
    "../../../../../web/compositions/users-manager/src",
    "../../../../../web/capabilities/projection/core/src",
    "../../../../../web/capabilities/source/core/src",
    "../../../../../web/capabilities/source/local/src",
    "../../../../../web/capabilities/users/core/src",
    "../../../../../web/capabilities/navigation/core/src",
    "../../../../../web/capabilities/navigation/configuration/src",
]
addopts = "-q --import-mode=importlib"
