[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-integrated-operations-application"
version = "0.1.2"
description = "Aplicación ADA de Operaciones Integradas sobre ADA Generic"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-generic-application==0.2.29",
    "ada-contracts-tools==1.0.0",
    "ada-web-operational-render-binding==0.1.0",
    "ada-web-content-state==0.1.0",
    "ada-web-ui-card-display==0.1.0",
    "ada-web-ui-inline-row==0.1.0",
    "ada-web-ui-stockpile==0.1.0",
    "ada-web-ui-equipment-image==0.1.0",
    "ada-web-ui-feeder==0.1.0",
    "ada-web-ui-time-series==0.1.0",
    "ada-web-ui-content-state==0.1.6",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
    "ada-web-kpi-collector==0.1.0",
    "ada-web-shell-header==0.1.8",
    "ada-web-ui-display-status==0.1.1",
    "ada-web-ui-global-indicator==0.2.10",
]

[dependency-groups]
dev = [
    "ruff==0.15.22",
]

[project.scripts]
ada-integrated-operations-application = "ada.web.application.integrated_operations.__main__:main"
ada-integrated-operations-resources = "ada.web.application.generic.manager_deployment:manager_resources_main"

