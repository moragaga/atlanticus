[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.application.integrated_operations*"]

[tool.setuptools.package-data]
"ada.web.application.integrated_operations" = ["py.typed"]
"ada.web.application.integrated_operations.modules.dashboard" = [
    "resources/css/*.css",
    "resources/css/css.list",
    "resources/js/*.js",
    "resources/js/js.list",
]
"ada.web.application.integrated_operations.modules.dashboard.mine" = [
    "resources/css/*.css",
    "resources/css/css.list",
]
"ada.web.application.integrated_operations.modules.dashboard.plant" = [
    "resources/css/*.css",
    "resources/css/css.list",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
