name: ada-integrated-operations-local

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command: azurite-blob --blobHost 0.0.0.0 --inMemoryPersistence --skipApiVersionCheck
    ports:
      - "${ADA_LOCAL_AZURITE_BLOB_PORT:-10000}:10000"
    restart: "no"
    mem_limit: 512m
    cpus: 0.50

  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    hostname: cosmos-emulator
    environment:
      PROTOCOL: "http"
      GATEWAY_PUBLIC_ENDPOINT: "cosmos-emulator"
      ENABLE_EXPLORER: "false"
      ENABLE_TELEMETRY: "false"
      LOG_LEVEL: "warn"
    ports:
      - "${ADA_LOCAL_COSMOS_READY_PORT:-8080}:8080"
      - "${ADA_LOCAL_COSMOS_PORT:-8081}:8081"
    restart: "no"
    mem_limit: 2g
    cpus: 1.00
