[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-time-status-runtime"
version = "0.1.0"
description = "Runtime browser bridge for ADA Time Status over KPI Collector system stores"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-contracts-tools==1.0.0",
    "ada-web-kpi-collector==0.1.0",
    "ada-web-ui-time-status==0.1.15",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
]

[tool.uv.sources]
ada-contracts-tools = { path = "../../../../ada-contracts/tools", editable = true }
ada-web-kpi-collector = { path = "../../kpis/collector", editable = true }
ada-web-ui-time-status = { path = "../../ui/time-status", editable = true }
atlanticus-web = { path = "../../../../../web/framework/core", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.time_status.runtime*"]

[tool.setuptools.package-data]
"ada.web.time_status.runtime" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../../kpis/collector/src",
    "../../ui/time-status/src",
    "../../../../ada-contracts/tools/src",
    "../../../../../web/framework/core/src",
]
addopts = "-q --import-mode=importlib"
