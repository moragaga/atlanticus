[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-kpi-management"
version = "0.1.0"
description = "Superficie de administración paginada para KPI Configuration en ADA"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-web-configuration==0.1.0",
    "ada-web-kpi-configuration==0.2.0",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
    "dash-bootstrap-components==2.0.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv.sources]
ada-web-configuration = { path = "../../configuration/core", editable = true }
ada-web-kpi-configuration = { path = "../configuration", editable = true }
atlanticus-web = { path = "../../../../../web/framework/core", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.kpis.management*"]

[tool.setuptools.package-data]
"ada.web.kpis.management" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "commented",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
