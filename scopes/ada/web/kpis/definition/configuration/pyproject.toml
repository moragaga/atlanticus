[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-kpi-definition-configuration"
version = "0.1.0"
description = "Source, Projection y editor Web de KPI Definition para ADA"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-web-kpi-definition==0.6.0",
    "ada-web-kpi-registry==0.1.0",
    "atlanticus-web-projection==0.1.0",
    "atlanticus-web-source==0.1.0",
]

[project.optional-dependencies]
web = [
    "ada-web-configuration==0.1.2",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
    "dash-bootstrap-components==2.0.4",
]

[dependency-groups]
dev = [
    "ada-web-configuration==0.1.2",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
    "dash-bootstrap-components==2.0.4",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv.sources]
ada-web-kpi-definition = { path = "../core", editable = true }
ada-web-kpi-registry = { path = "../../registry/core", editable = true }
ada-web-configuration = { path = "../../../configuration/core", editable = true }
atlanticus-web = { path = "../../../../../../web/framework/core", editable = true }
atlanticus-web-projection = { path = "../../../../../../web/capabilities/projection/core", editable = true }
atlanticus-web-source = { path = "../../../../../../web/capabilities/source/core", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.kpis.definition.configuration*"]

[tool.setuptools.package-data]
"ada.web.kpis.definition.configuration" = ["py.typed"]
"ada.web.kpis.definition.configuration.web" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../core/src",
    "../../registry/core/src",
    "../../../configuration/core/src",
    "../../../../../../web/framework/core/src",
    "../../../../../../web/capabilities/projection/core/src",
    "../../../../../../web/capabilities/source/core/src",
]
addopts = "-q --import-mode=importlib"
