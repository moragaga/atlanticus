[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-kpi-registry-projection-local"
version = "0.1.0"
description = "Persistencia local de la proyección del registro KPI de ADA"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-web-kpi-registry==0.1.0",
    "ada-web-kpi-registry-configuration==0.1.0",
    "atlanticus-web-projection==0.1.0",
    "atlanticus-web-source==0.1.0",
]

[tool.uv.sources]
ada-web-kpi-registry = { path = "../core", editable = true }
ada-web-kpi-registry-configuration = { path = "../configuration", editable = true }
atlanticus-web-projection = { path = "../../../../../../web/capabilities/projection/core", editable = true }
atlanticus-web-source = { path = "../../../../../../web/capabilities/source/core", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.kpis.registry.projection.local*"]

[tool.setuptools.package-data]
"ada.web.kpis.registry.projection.local" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../core/src",
    "../configuration/src",
    "../../../../../../web/capabilities/projection/core/src",
    "../../../../../../web/capabilities/source/core/src",
]
addopts = "-q --import-mode=importlib"
