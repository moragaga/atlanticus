[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-access-projection-local"
version = "0.1.0"
description = "Persistencia local de la proyección de acceso ADA Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-web-access==0.1.0",
    "ada-web-access-configuration==0.1.0",
    "atlanticus-web-projection==0.1.0",
    "atlanticus-web-source==0.1.0",
]

[tool.uv.sources]
ada-web-access = { path = "../core", editable = true }
ada-web-access-configuration = { path = "../configuration", editable = true }
atlanticus-web-projection = { path = "../../../../../web/capabilities/projection/core", editable = true }
atlanticus-web-source = { path = "../../../../../web/capabilities/source/core", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.access.projection.local*"]

[tool.setuptools.package-data]
"ada.web.access.projection.local" = ["py.typed"]
