[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-access"
version = "0.1.0"
description = "Contratos de acceso application-specific para ADA Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-web-profiles==0.1.0",
]

[tool.uv.sources]
atlanticus-web-profiles = { path = "../../../../../web/capabilities/profiles/core", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.access*"]

[tool.setuptools.package-data]
"ada.web.access" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../../../../../web/capabilities/profiles/core/src",
]
addopts = "-q --import-mode=importlib"
