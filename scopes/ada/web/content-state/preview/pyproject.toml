[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-content-state-preview"
version = "0.1.0"
description = "Harness visual aislado para Content State ADA"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-generic-application==0.1.31",
    "ada-web-content-state-dependency-resolver==0.1.0",
    "ada-web-kpi-inspection-api==0.1.0",
    "ada-web-kpi-inspection-core==0.2.0",
    "ada-web-kpi-inspection-surface==0.1.2",
    "ada-web-ui-content-state==0.1.4",
    "ada-web-ui-global-indicator==0.2.1",
    "ada-web-ui-time-status==0.1.10",
    "ada-web-alarm-management-summary==0.1.1",
    "ada-web-alarm-status==0.1.2",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.scripts]
ada-content-state-preview = "ada.web.content_state.preview.__main__:main"

[tool.uv]
constraint-dependencies = [
    "annotated-types==0.8.0",
    "blinker==1.9.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.4.2",
    "colorama==0.4.6",
    "comm==0.2.3",
    "dash-bootstrap-components==2.0.4",
    "dash==4.4.1",
    "flask==3.1.3",
    "idna==3.19",
    "importlib-metadata==9.0.0",
    "iniconfig==2.3.0",
    "itsdangerous==2.2.0",
    "janus==2.0.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "narwhals==2.25.0",
    "nest-asyncio==1.6.0",
    "packaging==26.3",
    "plotly==7.0.0",
    "pluggy==1.6.0",
    "pydantic-core==2.46.4",
    "pydantic==2.13.4",
    "pygments==2.21.0",
    "pytest==9.1.1",
    "rcssmin==1.2.2",
    "requests==2.34.2",
    "retrying==1.4.2",
    "rjsmin==1.2.5",
    "ruff==0.15.22",
    "setuptools==84.0.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.7.0",
    "werkzeug==3.1.8",
    "zipp==4.1.0",
]

[tool.uv.sources]
ada-generic-application = { path = "../../application/ada-generic-application", editable = true }
ada-web-content-state-dependency-resolver = { path = "../dependency-resolver", editable = true }
ada-web-kpi-inspection-api = { path = "../../inspection/api", editable = true }
ada-web-kpi-inspection-core = { path = "../../inspection/core", editable = true }
ada-web-kpi-inspection-surface = { path = "../../inspection/surface", editable = true }
ada-web-ui-content-state = { path = "../../ui/content-state", editable = true }
ada-web-ui-global-indicator = { path = "../../ui/global-indicator", editable = true }
ada-web-ui-time-status = { path = "../../ui/time-status", editable = true }
ada-web-alarm-management-summary = { path = "../../alarms/management-summary", editable = true }
ada-web-alarm-status = { path = "../../alarms/status", editable = true }
atlanticus-web = { path = "../../../../../web/framework/core", editable = true }
atlanticus-web-observability = { path = "../../../../../web/framework/observability", editable = true }
atlanticus-web-identity = { path = "../../../../../web/capabilities/identity/core", editable = true }
atlanticus-web-identity-local = { path = "../../../../../web/capabilities/identity/local", editable = true }
atlanticus-web-navigation = { path = "../../../../../web/capabilities/navigation/core", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.content_state.preview*"]

[tool.setuptools.package-data]
"ada.web.content_state.preview" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "commented",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
