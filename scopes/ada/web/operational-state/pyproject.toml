[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-operational-state"
version = "0.1.0"
description = "Resolución de estado operacional Web reutilizable para aplicaciones ADA"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-configuration-tool-sources==0.1.0",
    "ada-web-content-state-core==0.1.0",
    "ada-web-content-state-dependency-resolver==0.2.0",
    "ada-web-time-status-store-adapter==0.1.0",
    "ada-web-ui-time-status==0.1.15",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv.sources]
ada-configuration-tool-sources = { path = "../configuration/tool-sources", editable = true }
ada-web-content-state-core = { path = "../content-state/core", editable = true }
ada-web-content-state-dependency-resolver = { path = "../content-state/dependency-resolver", editable = true }
ada-web-time-status-store-adapter = { path = "../time-status/store-adapter", editable = true }
ada-web-ui-time-status = { path = "../ui/time-status", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.operational_state*"]

[tool.setuptools.package-data]
"ada.web.operational_state" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "commented",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
