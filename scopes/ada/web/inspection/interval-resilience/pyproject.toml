[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-kpi-inspection-interval-resilience"
version = "0.1.4"
description = "Gate de resiliencia de KPI Inspection frente a rerenders periódicos Dash"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-web-kpi-inspection-surface==0.1.3",
    "ada-web-ui-global-indicator==0.2.2",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv.sources]
ada-web-kpi-inspection-surface = { path = "../surface", editable = true }
ada-web-ui-global-indicator = { path = "../../ui/global-indicator", editable = true }
atlanticus-web = { path = "../../../../../web/framework/core", editable = true }
atlanticus-web-observability = { path = "../../../../../web/framework/observability", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.inspection.interval_resilience*"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "commented",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../surface/src",
    "../../ui/global-indicator/src",
    "../../ui/display-status/src",
    "../../ui/core/src",
    "../../../../../web/framework/core/src",
    "../../../../../web/framework/observability/src",
]
addopts = "-q --import-mode=importlib"
