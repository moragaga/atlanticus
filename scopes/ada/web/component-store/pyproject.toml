[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-component-store"
version = "0.1.0"
description = "Contrato runtime de Store por Component para ADA Web"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-configuration-tools==0.4.0",
]

[tool.uv.sources]
ada-configuration-tools = { path = "../configuration/tools", editable = true }
ada-configuration-tool-sources = { path = "../configuration/tool-sources", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.component_store*"]

[tool.setuptools.package-data]
"ada.web.component_store" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "commented",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../configuration/tools/src",
    "../configuration/tool-sources/src",
]
addopts = "-q --import-mode=importlib"
