[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-configuration-manager-tools"
version = "0.1.1"
description = "Surface reusable de Manager para configuración de Tools ADA"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "ada-configuration-branding==0.1.0",
    "ada-web-tool-configuration-editor==0.1.1",
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv.sources]
ada-configuration-branding = { path = "../branding", editable = true }
ada-web-tool-configuration-editor = { path = "../tool-editor", editable = true }
atlanticus-web = { path = "../../../../../web/framework/core", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.configuration.manager_tools*"]

[tool.setuptools.package-data]
"ada.web.configuration.manager_tools" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../branding/src",
    "../tool-editor/src",
    "../tools/src",
    "../tool-sources/src",
    "../../../../../web/framework/core/src",
]
addopts = "-q --import-mode=importlib"
