[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-web-operational-identification"
version = "0.1.0"
description = "ADA Web operational catalogs and per-user identification"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-cosmos==1.0.0",
    "atlanticus-web-projection==0.1.0",
    "atlanticus-web-source==0.1.0",
    "atlanticus-web-users==0.1.0",
]

[tool.uv.sources]
atlanticus-cosmos = { path = "../../../../connectivity/cosmos", editable = true }
atlanticus-observability = { path = "../../../../backend/observability", editable = true }
atlanticus-web-projection = { path = "../../../../web/capabilities/projection/core", editable = true }
atlanticus-web-source = { path = "../../../../web/capabilities/source/core", editable = true }
atlanticus-web-users = { path = "../../../../web/capabilities/users/core", editable = true }
atlanticus-web-profiles = { path = "../../../../web/capabilities/profiles/core", editable = true }
atlanticus-web-identity = { path = "../../../../web/capabilities/identity/core", editable = true }

[dependency-groups]
dev = [
    "atlanticus-web-source-local==0.1.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv.sources.atlanticus-web-source-local]
path = "../../../../web/capabilities/source/local"
editable = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["ada.web.operational.identification*"]

[tool.setuptools.package-data]
"ada.web.operational.identification" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../../../../connectivity/cosmos/src",
    "../../../../backend/observability/src",
    "../../../../web/capabilities/projection/core/src",
    "../../../../web/capabilities/source/core/src",
    "../../../../web/capabilities/source/local/src",
    "../../../../web/capabilities/users/core/src",
    "../../../../web/capabilities/profiles/core/src",
    "../../../../web/capabilities/identity/core/src",
]
addopts = "-q --import-mode=importlib"
