[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-kpis-evaluation"
version = "1.0.0"
description = "Pure KPI evaluation semantics for the ADA backend."
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "ada-kpis-core==1.0.0",
    "atlanticus-operational-data-core==1.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ada.kpis.evaluation*"]
namespaces = true

[tool.setuptools.package-data]
"ada.kpis.evaluation" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ada", "atlanticus"]
combine-as-imports = true
