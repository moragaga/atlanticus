[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-datasets-runtime"
version = "1.0.0"
description = "Bidirectional Pandas and PyArrow facade for Atlanticus datasets."
readme = "README.md"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "atlanticus-datasets==1.0.0",
    "atlanticus-datasets-parquet==1.0.0",
    "pandas==3.0.3",
    "pyarrow==25.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.datasets.runtime" = ["py.typed"]
