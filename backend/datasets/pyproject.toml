[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-datasets"
version = "1.0.0"
description = "Neutral dataset identity, layout and publication contracts for Atlanticus."
readme = "README.md"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 5 - Production/Stable",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlanticus.*"]
namespaces = true

[tool.setuptools.package-data]
"atlanticus.datasets" = ["py.typed"]
