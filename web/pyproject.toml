[project]
name = "atlanticus-web-workspace"
version = "0.1.0"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-web==0.1.0",
    "atlanticus-web-bootstrap==0.1.0",
    "atlanticus-web-identity==0.1.0",
    "atlanticus-web-identity-local==0.1.0",
    "atlanticus-web-navigation==0.1.0",
    "atlanticus-web-navigation-configuration==0.1.9",
    "atlanticus-web-navigation-projection-local==0.1.0",
    "atlanticus-web-navigation-projection-cosmos==0.1.0",
    "atlanticus-web-manager==0.3.18",
    "atlanticus-web-profiles==0.1.0",
    "atlanticus-web-profiles-configuration==0.1.0",
    "atlanticus-web-profiles-projection-local==0.1.0",
    "atlanticus-web-profiles-projection-cosmos==0.1.0",
    "atlanticus-web-projection==0.1.0",
    "atlanticus-web-source==0.1.0",
    "atlanticus-web-source-local==0.1.0",
    "atlanticus-web-source-blob==0.1.0",
    "atlanticus-web-storage-topology==0.1.0",
    "atlanticus-web-storage-cosmos==0.1.0",
    "atlanticus-web-configuration==0.1.0",
    "atlanticus-web-pwa==0.1.0",
    "atlanticus-web-users==0.1.0",
    "atlanticus-web-users-cosmos==0.1.0",
    "atlanticus-web-users-blob==0.1.0",
    "atlanticus-web-users-activity==0.1.0",
    "atlanticus-web-composition-navigation-activity==0.1.0",
    "atlanticus-web-composition-navigation-manager==0.1.0",
    "atlanticus-web-composition-profiles-manager==0.1.0",
    "atlanticus-web-composition-users-manager==0.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.sources]
atlanticus-web = { workspace = true }
atlanticus-web-bootstrap = { workspace = true }
atlanticus-web-observability = { workspace = true }
atlanticus-web-identity = { workspace = true }
atlanticus-web-identity-local = { workspace = true }
atlanticus-web-navigation = { workspace = true }
atlanticus-web-navigation-configuration = { workspace = true }
atlanticus-web-navigation-projection-local = { workspace = true }
atlanticus-web-navigation-projection-cosmos = { workspace = true }
atlanticus-web-manager = { workspace = true }
atlanticus-web-profiles = { workspace = true }
atlanticus-web-profiles-configuration = { workspace = true }
atlanticus-web-profiles-projection-local = { workspace = true }
atlanticus-web-profiles-projection-cosmos = { workspace = true }
atlanticus-web-projection = { workspace = true }
atlanticus-web-source = { workspace = true }
atlanticus-web-source-local = { workspace = true }
atlanticus-web-source-blob = { workspace = true }
atlanticus-web-storage-topology = { workspace = true }
atlanticus-web-storage-cosmos = { workspace = true }
atlanticus-cosmos = { path = "../connectivity/cosmos", editable = true }
atlanticus-storage = { path = "../connectivity/storage" }
atlanticus-observability = { path = "../backend/observability" }
atlanticus-kernel = { path = "../backend/kernel" }

atlanticus-web-configuration = { workspace = true }
atlanticus-web-pwa = { workspace = true }
atlanticus-web-users = { workspace = true }
atlanticus-web-users-cosmos = { workspace = true }
atlanticus-web-users-blob = { workspace = true }
atlanticus-web-users-activity = { workspace = true }
atlanticus-web-composition-navigation-activity = { workspace = true }
atlanticus-web-composition-navigation-manager = { workspace = true }
atlanticus-web-composition-profiles-manager = { workspace = true }
atlanticus-web-composition-users-manager = { workspace = true }

[tool.uv.workspace]
members = [
    "framework/core",
    "framework/bootstrap",
    "framework/observability",
    "capabilities/identity/core",
    "capabilities/identity/local",
    "capabilities/navigation/core",
    "capabilities/navigation/configuration",
    "capabilities/navigation/projection-local",
    "capabilities/navigation/projection-cosmos",
    "capabilities/manager",
    "capabilities/profiles/core",
    "capabilities/profiles/configuration",
    "capabilities/profiles/projection-local",
    "capabilities/profiles/projection-cosmos",
    "capabilities/projection/core",
    "capabilities/source/core",
    "capabilities/source/local",
    "capabilities/source/blob",
    "capabilities/storage/topology",
    "capabilities/storage/cosmos",
    "framework/configuration",
    "framework/pwa",
    "capabilities/users/core",
    "capabilities/users/cosmos",
    "capabilities/users/blob",
    "capabilities/users/activity",
    "compositions/navigation-activity",
    "compositions/navigation-manager",
    "compositions/profiles-manager",
    "compositions/users-manager",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "**/commented/**",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = [
    "framework/core/tests",
    "framework/bootstrap/tests",
    "framework/observability/tests",
    "capabilities/identity/core/tests",
    "capabilities/identity/local/tests",
    "capabilities/navigation/core/tests",
    "capabilities/navigation/configuration/tests",
    "capabilities/navigation/projection-local/tests",
    "capabilities/navigation/projection-cosmos/tests",
    "capabilities/manager/tests",
    "capabilities/profiles/core/tests",
    "capabilities/profiles/configuration/tests",
    "capabilities/profiles/projection-local/tests",
    "capabilities/profiles/projection-cosmos/tests",
    "capabilities/projection/core/tests",
    "capabilities/source/core/tests",
    "capabilities/source/local/tests",
    "capabilities/source/blob/tests",
    "capabilities/storage/topology/tests",
    "capabilities/storage/cosmos/tests",
    "framework/configuration/tests",
    "framework/pwa/tests",
    "capabilities/users/core/tests",
    "capabilities/users/cosmos/tests",
    "capabilities/users/blob/tests",
    "capabilities/users/activity/tests",
    "compositions/navigation-activity/tests",
    "compositions/navigation-manager/tests",
    "compositions/profiles-manager/tests",
    "compositions/users-manager/tests",
]
addopts = "-q --import-mode=importlib"
