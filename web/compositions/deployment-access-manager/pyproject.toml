[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-composition-deployment-access-manager"
version = "0.1.0"
description = "Composición de sesión ROOT independiente para Atlanticus Web Manager"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-web-deployment-access==0.1.0",
    "atlanticus-web-manager==0.3.19",
    "atlanticus-web-identity==0.1.0",
    "Flask==3.1.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv.sources]
atlanticus-web-deployment-access = { path = "../../capabilities/deployment-access", editable = true }
atlanticus-web-manager = { path = "../../capabilities/manager", editable = true }
atlanticus-web-identity = { path = "../../capabilities/identity/core", editable = true }
atlanticus-web = { path = "../../framework/core", editable = true }
atlanticus-web-source = { path = "../../capabilities/source/core", editable = true }
atlanticus-web-projection = { path = "../../capabilities/projection/core", editable = true }
atlanticus-web-configuration = { path = "../../framework/configuration", editable = true }
atlanticus-web-observability = { path = "../../framework/observability", editable = true }
atlanticus-storage = { path = "../../../connectivity/storage", editable = true }
atlanticus-observability = { path = "../../../backend/observability", editable = true }
atlanticus-kernel = { path = "../../../backend/kernel", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.compositions.deployment_access_manager*"]

[tool.setuptools.package-data]
"atlanticus.web.compositions.deployment_access_manager" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
