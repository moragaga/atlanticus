[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-configuration"
version = "0.1.0"
description = "Typed environment configuration for Atlanticus Web runtimes"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "pydantic-settings==2.14.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.configuration*"]

[tool.setuptools.package-data]
"atlanticus.web.configuration" = ["py.typed"]
