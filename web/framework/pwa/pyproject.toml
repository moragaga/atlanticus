[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-pwa"
version = "0.1.0"
description = "Progressive Web App capability for Atlanticus Web"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-web==0.1.0",
    "Flask==3.1.3",
]

[tool.uv.sources]
atlanticus-web = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.pwa*"]

[tool.setuptools.package-data]
"atlanticus.web.pwa" = [
    "py.typed",
    "resources/service-worker.js",
    "resources/assets/js/*.js",
    "resources/assets/js/js.list",
]
