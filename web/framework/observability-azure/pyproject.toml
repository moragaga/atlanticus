[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-observability-azure"
version = "0.1.0"
description = "Adaptador explícito de eventos Web hacia Azure Monitor"
requires-python = "==3.14.2"
dependencies = [
    "atlanticus-web-configuration==0.1.0",
    "atlanticus-web-observability==0.3.0",
    "atlanticus-observability-azure==1.0.0",
]

[tool.uv.sources]
atlanticus-web-configuration = { workspace = true }
atlanticus-web-observability = { workspace = true }
atlanticus-observability-azure = { path = "../../../backend/observability-azure" }
atlanticus-observability = { path = "../../../backend/observability" }
atlanticus-kernel = { path = "../../../backend/kernel" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.observability_azure*"]

[tool.setuptools.package-data]
"atlanticus.web.observability_azure" = ["py.typed"]
