[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-bootstrap"
version = "0.1.0"
description = "Scoped Bootstrap component integration for Atlanticus Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-web==0.1.0",
    "dash-bootstrap-components==2.0.4",
]

[tool.uv.sources]
atlanticus-web = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.bootstrap*"]

[tool.setuptools.package-data]
"atlanticus.web.bootstrap" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]
