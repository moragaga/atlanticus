[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web"
version = "0.1.0"
description = "Base web modular de Atlanticus para Flask y Dash Pages"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-web-observability==0.1.0",
    "dash==4.4.1",
    "Flask==3.1.3",
    "rcssmin==1.2.2",
    "rjsmin==1.2.5",
]

[tool.uv.sources]
atlanticus-web-observability = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web*"]

[tool.setuptools.package-data]
"atlanticus.web" = [
    "py.typed",
    "resources/base/css/*.css",
    "resources/base/css/css.list",
    "resources/base/js/*.js",
    "resources/base/js/js.list",
]
