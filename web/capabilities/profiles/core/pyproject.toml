[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-profiles"
version = "0.1.0"
description = "Perfiles reutilizables para aplicaciones web Atlanticus"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.profiles*"]

[tool.setuptools.package-data]
"atlanticus.web.profiles" = ["py.typed"]
