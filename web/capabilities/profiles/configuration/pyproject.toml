[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-profiles-configuration"
version = "0.1.0"
description = "Configuración administrativa de perfiles para Atlanticus Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-web-profiles==0.1.0",
    "atlanticus-web-source==0.1.0",
]

[project.optional-dependencies]
web = [
    "atlanticus-web==0.1.0",
    "atlanticus-web-bootstrap==0.1.0",
    "dash-bootstrap-components==2.0.4",
    "dash==4.4.1",
]

[tool.uv.sources]
atlanticus-web-profiles = { workspace = true }
atlanticus-web-source = { workspace = true }
atlanticus-web = { workspace = true }
atlanticus-web-bootstrap = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.profiles.configuration*"]

[tool.setuptools.package-data]
"atlanticus.web.profiles.configuration" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]
