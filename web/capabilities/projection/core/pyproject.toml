[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-projection"
version = "0.1.0"
description = "Contrato de Projection exact-release para aplicaciones web Atlanticus"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = ["atlanticus-web-source==0.1.0"]

[tool.uv.sources]
atlanticus-web-source = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.projection*"]

[tool.setuptools.package-data]
"atlanticus.web.projection" = ["py.typed"]
