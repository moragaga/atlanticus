[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-master-projection"
version = "0.1.0"
description = "Motor reusable Master Projection para aplicaciones Atlanticus Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-storage==1.0.0",
    "atlanticus-web==0.1.0",
    "atlanticus-web-identity==0.1.0",
    "atlanticus-web-projection==0.1.0",
    "atlanticus-web-source==0.1.0",
    "Flask==3.1.3",
    "pyzipper==0.4.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv.sources]
atlanticus-storage = { path = "../../../connectivity/storage" }
atlanticus-web = { path = "../../framework/core", editable = true }
atlanticus-web-identity = { path = "../identity/core", editable = true }
atlanticus-web-projection = { path = "../projection/core", editable = true }
atlanticus-web-source = { path = "../source/core", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.master_projection*"]

[tool.setuptools.package-data]
"atlanticus.web.master_projection" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
