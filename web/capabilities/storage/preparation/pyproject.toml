[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-storage-preparation"
version = "0.1.0"
description = "Preparación y validación durable de recursos de almacenamiento Web Atlanticus"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-cosmos==1.0.0",
    "atlanticus-storage==1.0.0",
    "atlanticus-web-configuration==0.1.0",
    "atlanticus-web-storage-cosmos==0.1.0",
    "atlanticus-web-storage-topology==0.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv.sources]
atlanticus-web-configuration = { workspace = true }
atlanticus-web-storage-cosmos = { workspace = true }
atlanticus-web-storage-topology = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.storage.preparation*"]

[tool.setuptools.package-data]
"atlanticus.web.storage.preparation" = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["build", "dist", "commented"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlanticus"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"
