[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-storage-topology"
version = "0.1.0"
description = "Contrato de topología de almacenamiento para capacidades web Atlanticus"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.storage.topology*"]

[tool.setuptools.package-data]
"atlanticus.web.storage.topology" = ["py.typed"]
