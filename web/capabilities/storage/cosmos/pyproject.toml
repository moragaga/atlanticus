[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-storage-cosmos"
version = "0.1.0"
description = "Bridge Cosmos para resource topology de aplicaciones web Atlanticus"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-cosmos==1.0.0",
    "atlanticus-web-storage-topology==0.1.0",
]

[tool.uv.sources]
atlanticus-web-storage-topology = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.storage.cosmos*"]

[tool.setuptools.package-data]
"atlanticus.web.storage.cosmos" = ["py.typed"]
