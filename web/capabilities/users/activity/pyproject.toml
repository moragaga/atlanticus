[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-users-activity"
version = "0.1.0"
description = "Functional user activity tracking for Atlanticus Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "atlanticus-web==0.1.0",
    "atlanticus-web-identity==0.1.0",
    "Flask==3.1.3",
]

[tool.uv.sources]
atlanticus-web = { workspace = true }
atlanticus-web-identity = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.users.activity*"]

[tool.setuptools.package-data]
"atlanticus.web.users.activity" = [
    "py.typed",
    "resources/js/*.js",
    "resources/js/js.list",
]
