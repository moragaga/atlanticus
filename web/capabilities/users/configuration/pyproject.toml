[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-users-configuration"
version = "0.1.6"
description = "Configuración administrativa de usuarios y perfiles para Atlanticus Web"
requires-python = "==3.14.2"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["atlanticus-web-users==0.1.0"]

[project.optional-dependencies]
web = [
    "atlanticus-web==0.1.0",
    "dash==4.4.1",
]

[tool.uv.sources]
atlanticus-web-users = { workspace = true }
atlanticus-web = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.users.configuration*"]

[tool.setuptools.package-data]
"atlanticus.web.users.configuration" = [
    "py.typed",
    "resources/css/*.css",
    "resources/css/css.list",
]
