[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-users-projection-cosmos"
version = "0.1.1"
description = "Persistencia Cosmos de proyección canónica y materialización runtime de usuarios Atlanticus Web"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-cosmos==1.0.0",
    "atlanticus-web-projection==0.1.0",
    "atlanticus-web-source==0.1.0",
    "atlanticus-web-users==0.1.0",
    "atlanticus-web-users-configuration==0.1.9",
]

[tool.uv.sources]
atlanticus-web-projection = { workspace = true }
atlanticus-web-source = { workspace = true }
atlanticus-web-users = { workspace = true }
atlanticus-web-users-configuration = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.users.projection.cosmos*"]

[tool.setuptools.package-data]
"atlanticus.web.users.projection.cosmos" = ["py.typed"]
