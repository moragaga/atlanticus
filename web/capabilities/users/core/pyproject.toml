[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-users"
version = "0.1.0"
description = "Runtime de usuarios y perfiles para aplicaciones web Atlanticus"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-web==0.1.0",
    "atlanticus-web-identity==0.1.0",
    "Flask==3.1.3",
]

[tool.uv.sources]
atlanticus-web = { workspace = true }
atlanticus-web-identity = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.users*"]

[tool.setuptools.package-data]
"atlanticus.web.users" = ["py.typed"]
