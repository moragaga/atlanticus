[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlanticus-web-users-blob"
version = "0.1.0"
description = "Registro durable Blob de usuarios globales Atlanticus Web"
requires-python = "==3.14.2"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "atlanticus-storage==1.0.0",
    "atlanticus-web-users==0.1.0",
]

[tool.uv.sources]
atlanticus-web-users = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["atlanticus.web.users.blob*"]

[tool.setuptools.package-data]
"atlanticus.web.users.blob" = ["py.typed"]
